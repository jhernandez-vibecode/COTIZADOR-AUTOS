  <text x="31" y="74" font-family="'Space Grotesk','Inter',sans-serif" font-weight="500" font-size="82" letter-spacing="-2.5" fill="#FFFFFF">SDI</text>

  <g transform="translate(161, 15)">
    <rect x="0" y="0" width="30" height="9" rx="1.5" fill="#FFFFFF"/>
    <rect x="0" y="16.67" width="30" height="9" rx="1.5" fill="#FFFFFF"/>
    <rect x="0" y="33.33" width="30" height="9" rx="1.5" fill="#FFFFFF"/>
    <rect x="0" y="50" width="30" height="9" rx="1.5" fill="#FFFFFF"/>
  </g>

  <text x="111" y="100" text-anchor="middle" font-family="'Inter',sans-serif" font-weight="500" font-size="14" letter-spacing="3.5" fill="#FFFFFF">SEGUROS DIGITALES</text>
</svg>
